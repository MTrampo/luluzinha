<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sem Conexão | Luluzinha</title>
  <meta name="theme-color" content="#3c0366" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #fcf9fe;
      color: #2e1065;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #f3e8ff;
      border-radius: 24px;
      padding: 40px 28px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(60, 3, 102, 0.05), 0 8px 10px -6px rgba(60, 3, 102, 0.04);
    }
    .icon-wrapper {
      width: 72px;
      height: 72px;
      background: #f3e8ff;
      color: #7c3aed;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }
    .icon-wrapper svg {
      width: 36px;
      height: 36px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #3c0366;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: #6b7280;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      background: #3c0366;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      text-decoration: none;
    }
    .btn:hover {
      background: #581c87;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .footer-note {
      margin-top: 24px;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>Sem conexão no momento</h1>
    <p>Para cuidar das suas Poderosas e manter sua agenda de atendimentos sempre atualizada, você precisa estar conectada à internet.</p>
    <button class="btn" onclick="window.location.reload()">Tentar Novamente</button>
    <div class="footer-note">Luluzinha • Seu Espaço Digital</div>
  </div>
</body>
</html>
